name: Build and publish to GHCR

on:
  push:
    branches: [master]
    tags: ['**']
  workflow_dispatch:
  pull_request:
    branches: [master]

# Do not interrupt a publication halfway through updating tags.
concurrency:
  group: ghcr-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Validate and build Debian image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate shell scripts and input method
        shell: bash
        run: |
          set -euo pipefail
          bash -n overlay/usr/bin/configure-input-method.sh overlay/usr/bin/start-desktop.sh tests/input-method.sh
          bash tests/input-method.sh

      # Hosted runners have limited disk space. Remove only unused SDKs/tools,
      # not Docker, /var/lib/docker or the BuildKit cache.
      - name: Free disk space before building
        shell: bash
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost /usr/local/share/powershell
          df -h /

      - name: Prepare image name and version
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "image=ghcr.io/${owner}/steam-headless" >> "$GITHUB_OUTPUT"
          printf 'Build: [%s] [%s] [%s] [debian]\n' "$(date -u +'%FT%TZ')" "$GITHUB_REF_NAME" "$GITHUB_SHA" > overlay/version.txt

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@6524bf65af31da8d45b59e8c27de4bd072b392f5 # v3.8.0

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@369eb591f429131d6889c46b94e711f089e6ca96 # v5.6.1
        with:
          images: ${{ steps.prepare.outputs.image }}
          # Only master moves the rolling tags; tag/manual builds still get SHA tags.
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}
            type=raw,value=debian,enable=${{ github.ref == 'refs/heads/master' }}
            type=sha,format=long,prefix=sha-
            type=ref,event=tag,prefix=debian-
            type=ref,event=pr
          labels: |
            org.opencontainers.image.title=steam-headless
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.url=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image (publish only outside PRs)
        uses: docker/build-push-action@b32b51a8eda65d6793cd0494a773d4f6bcef32dc # v6.11.0
        with:
          context: .
          file: Dockerfile.debian
          platforms: linux/amd64
          pull: true
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=steam-headless-debian
          # Cache final-image layers to limit cache size for this large image.
          cache-to: type=gha,scope=steam-headless-debian,mode=min,ignore-error=true
